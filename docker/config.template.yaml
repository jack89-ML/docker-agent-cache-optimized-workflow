model:
  default: {MODEL_NAME}
  provider: freetoken
providers:
  freetoken:
    base_url: {FREETOKEN_BASE_URL}
    api_key: local
    context_length: 131072
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
        thinking_mode: disabled
    models:
      - id: {MODEL_NAME}
        context_length: 131072
        max_output_tokens: 16384
